<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>비즈테크 모바일</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
     background:#f0f2f5;color:#212121;height:100dvh;overflow:hidden}

/* ── 로그인 ── */
#login{display:flex;align-items:center;justify-content:center;height:100dvh;
       background:linear-gradient(150deg,#1565c0 0%,#0d47a1 100%)}
.lbox{background:#fff;border-radius:20px;padding:38px 28px 28px;width:min(340px,92vw);
      box-shadow:0 12px 40px rgba(0,0,0,.3)}
.llogo{text-align:center;margin-bottom:28px}
.llogo h1{color:#1565c0;font-size:28px;font-weight:800;letter-spacing:-1px}
.llogo p{color:#90a4ae;font-size:13px;margin-top:5px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;color:#546e7a;margin-bottom:5px;font-weight:600}
.fi{width:100%;padding:12px 14px;border:1.5px solid #cfd8dc;border-radius:10px;
    font-size:15px;outline:none;transition:border-color .2s;background:#fafafa}
.fi:focus{border-color:#1565c0;background:#fff}
.lbtn{width:100%;padding:14px;background:#1565c0;color:#fff;border:none;border-radius:12px;
      font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
.lbtn:active{background:#0d47a1}
.lerr{color:#e53935;font-size:13px;text-align:center;margin-top:10px;min-height:18px}

/* ── 앱 레이아웃 ── */
#app{display:none;flex-direction:column;height:100dvh}
#hd{background:#1565c0;color:#fff;padding:11px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;min-height:50px}
#hd-co{font-size:15px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hd-tab{font-size:12px;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:20px;flex-shrink:0}
#hd-out{background:rgba(255,255,255,.12);border:none;color:#fff;padding:6px 11px;border-radius:8px;font-size:12px;cursor:pointer;flex-shrink:0}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.panel{display:none;padding:14px}
.panel.on{display:block}
#nav{background:#fff;border-top:1px solid #e0e0e0;display:flex;height:58px;flex-shrink:0}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;font-size:10px;color:#9e9e9e;cursor:pointer}
.nb.on{color:#1565c0}
.nb-ic{font-size:20px;line-height:1}

/* ── 공통 카드/폼 ── */
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:11px}
.card-title{font-size:11px;font-weight:700;color:#90a4ae;letter-spacing:.6px;margin-bottom:10px;text-transform:uppercase}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fl{font-size:12px;color:#546e7a;margin-bottom:4px;font-weight:600}
.fin{width:100%;padding:10px 11px;border:1.5px solid #e0e0e0;border-radius:9px;font-size:14px;outline:none;background:#fafafa}
.fin:focus{border-color:#1565c0;background:#fff}

/* ── 다중 드래프트 카드 ── */
.draft-card{background:#fff;border-radius:14px;margin-bottom:12px;
            box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden}
.draft-hd{display:flex;align-items:center;padding:13px 14px;cursor:pointer;gap:8px}
.draft-hd:active{background:#f5f5f5}
.draft-hd-info{flex:1;min-width:0}
.draft-client{display:block;font-size:15px;font-weight:700;
              overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.draft-client.empty{color:#90a4ae}
.draft-meta{display:block;font-size:12px;color:#90a4ae;margin-top:2px}
.draft-badge{background:#e3f2fd;color:#1565c0;font-size:12px;font-weight:700;
             padding:4px 10px;border-radius:20px;flex-shrink:0}
.draft-hd-btns{display:flex;align-items:center;gap:6px;flex-shrink:0}
.draft-del-btn{background:none;border:none;color:#ccc;font-size:20px;cursor:pointer;padding:2px 4px;line-height:1}
.draft-del-btn:active{color:#e53935}
.draft-arrow{color:#bdbdbd;font-size:14px;width:16px;text-align:center}
.draft-body{padding:0 12px 12px;border-top:1px solid #f5f5f5}

/* ── 품목 카드 ── */
.ic{border:1.5px solid #e8edf2;border-radius:11px;padding:11px;margin-bottom:9px;background:#f8f9fb}
.ic-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.ic-name{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic-del{background:none;border:none;color:#ccc;font-size:20px;cursor:pointer;line-height:1;padding:0 4px}
.ic-del:active{color:#e53935}
.ic-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.ic-lbl{font-size:11px;color:#78909c;margin-bottom:3px;font-weight:600}
.ic-inp{width:100%;padding:8px 8px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;outline:none;text-align:right;background:#fff}
.ic-inp:focus{border-color:#1565c0}
.ic-inp.sel-btn{text-align:left;cursor:pointer;font-size:12px;white-space:nowrap;overflow:hidden}
.ic-amt{padding:8px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;font-weight:700;color:#1565c0;text-align:right;background:#fff}
.add-btn{width:100%;padding:11px;background:none;border:1.5px dashed #90caf9;border-radius:11px;color:#1565c0;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px}
.add-btn:active{background:#e3f2fd}

/* ── 결제 ── */
.pay-row{display:flex;align-items:center;margin-bottom:8px}
.pay-lbl{width:52px;font-size:13px;color:#546e7a;font-weight:600;flex-shrink:0}
.pay-inp{flex:1;padding:9px 11px;border:1.5px solid #e0e0e0;border-radius:9px;font-size:14px;text-align:right;outline:none;background:#fafafa}
.pay-inp:focus{border-color:#1565c0;background:#fff}
.pay-um{flex:1;padding:9px 11px;font-size:14px;text-align:right;color:#e65100;font-weight:700}

/* ── 합계/저장 ── */
.tot-bar{background:#1565c0;color:#fff;border-radius:11px;padding:12px 14px;
         display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.tot-lbl{font-size:12px;opacity:.8}
.tot-amt{font-size:20px;font-weight:800}
.save-btn{width:100%;padding:13px;background:#2e7d32;color:#fff;border:none;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer}
.save-btn:active{background:#1b5e20}
.add-draft-btn{width:100%;padding:14px;background:none;border:2px dashed #90caf9;border-radius:14px;color:#1565c0;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:16px}
.add-draft-btn:active{background:#e3f2fd}

/* ── 조회 탭 ── */
.srch-box{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;gap:8px}
.srch-box input{flex:1;padding:9px 12px;border:1.5px solid #e0e0e0;border-radius:9px;font-size:14px;outline:none}
.srch-box input:focus{border-color:#1565c0}
.list-card{background:#fff;border-radius:10px;padding:13px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:flex-start}
.lc-left .lc-name{font-size:15px;font-weight:700}
.lc-left .lc-sub{font-size:12px;color:#90a4ae;margin-top:3px}
.lc-right{text-align:right;flex-shrink:0;margin-left:8px}
.lc-price{font-size:14px;font-weight:700;color:#1565c0}
.lc-code{font-size:11px;color:#bdbdbd;margin-top:3px}
.empty{text-align:center;color:#bdbdbd;padding:40px 0;font-size:14px}

/* ── 바텀시트 모달 ── */
#modal{position:fixed;inset:0;z-index:900;display:none;flex-direction:column;justify-content:flex-end}
#modal.on{display:flex}
.m-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.m-sheet{position:relative;background:#fff;border-radius:22px 22px 0 0;max-height:80dvh;display:flex;flex-direction:column;z-index:1}
.m-hd{padding:16px 16px 0;display:flex;align-items:center;gap:10px}
.m-hd h3{flex:1;font-size:16px;font-weight:700}
.m-close{background:none;border:none;font-size:24px;color:#bdbdbd;cursor:pointer;padding:0 4px;line-height:1}
.m-srch{padding:10px 16px}
.m-srch input{width:100%;padding:11px 14px;border:1.5px solid #e0e0e0;border-radius:11px;font-size:15px;outline:none}
.m-srch input:focus{border-color:#1565c0}
.m-list{overflow-y:auto;flex:1;padding:0 12px 20px}
.mi{padding:13px 6px;border-bottom:1px solid #f5f5f5;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.mi:active{background:#e3f2fd;border-radius:8px}
.mi-name{font-size:14px;font-weight:600}
.mi-sub{font-size:12px;color:#90a4ae;margin-top:2px}
.mi-price{font-size:13px;font-weight:700;color:#1565c0;flex-shrink:0;margin-left:10px}

/* ── 토스트 / 로딩 ── */
#toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(10px);
       background:#323232;color:#fff;padding:10px 22px;border-radius:24px;font-size:14px;
       opacity:0;transition:all .3s;z-index:9999;white-space:nowrap;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.65);align-items:center;justify-content:center;z-index:9998;display:none}
#loading.on{display:flex}
.spin{width:38px;height:38px;border:4px solid #e0e0e0;border-top-color:#1565c0;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login">
  <div class="lbox">
    <div class="llogo"><h1>비즈테크</h1><p>모바일 경영관리</p></div>
    <div class="fg"><label>사용자</label><input id="l-u" class="fi" placeholder="아이디" value="admin" autocomplete="username"></div>
    <div class="fg"><label>비밀번호</label><input id="l-p" class="fi" type="password" placeholder="비밀번호" autocomplete="current-password"></div>
    <button class="lbtn" onclick="doLogin()">로그인</button>
    <div id="lerr" class="lerr"></div>
  </div>
</div>

<!-- 앱 -->
<div id="app">
  <div id="hd">
    <span id="hd-co">비즈테크</span>
    <span id="hd-tab">매출 입력</span>
    <button id="hd-out" onclick="doLogout()">로그아웃</button>
  </div>
  <div id="content">

    <!-- 매출 입력 -->
    <div id="p-sales" class="panel on">
      <button class="add-draft-btn" onclick="addDraft('s')">+ 새 매출 추가</button>
      <div id="s-drafts-wrap"></div>
    </div>

    <!-- 매입 입력 -->
    <div id="p-purchase" class="panel">
      <button class="add-draft-btn" onclick="addDraft('b')">+ 새 매입 추가</button>
      <div id="b-drafts-wrap"></div>
    </div>

    <!-- 거래처 조회 -->
    <div id="p-clients" class="panel">
      <div class="srch-box"><input id="cl-q" placeholder="이름 또는 코드 검색" oninput="renderClients()"></div>
      <div id="cl-list"></div>
    </div>

    <!-- 품목 조회 -->
    <div id="p-items" class="panel">
      <div class="srch-box"><input id="it-q" placeholder="이름 또는 코드 검색" oninput="renderItems()"></div>
      <div id="it-list"></div>
    </div>

  </div>

  <div id="nav">
    <button class="nb on" id="nb-sales"    onclick="switchTab('sales')"><span class="nb-ic">📦</span><span>매출</span></button>
    <button class="nb"    id="nb-purchase" onclick="switchTab('purchase')"><span class="nb-ic">🛒</span><span>매입</span></button>
    <button class="nb"    id="nb-clients"  onclick="switchTab('clients')"><span class="nb-ic">👥</span><span>거래처</span></button>
    <button class="nb"    id="nb-items"    onclick="switchTab('items')"><span class="nb-ic">📋</span><span>품목</span></button>
  </div>
</div>

<!-- 검색 모달 -->
<div id="modal">
  <div class="m-bg" onclick="closeModal()"></div>
  <div class="m-sheet">
    <div class="m-hd"><h3 id="m-title">검색</h3><button class="m-close" onclick="closeModal()">×</button></div>
    <div class="m-srch"><input id="m-q" placeholder="검색어 입력" oninput="filterModal()"></div>
    <div class="m-list" id="m-list"></div>
  </div>
</div>

<div id="toast"></div>
<div id="loading"><div class="spin"></div></div>

<script>
const API = window.location.origin;
let TOKEN = localStorage.getItem('bm_tok') || '';
let USERNAME = localStorage.getItem('bm_usr') || '';
let CLIENTS = [], ITEMS = [];

// ── 드래프트 상태 ──
let sDrafts = [], bDrafts = [];
let _draftIdCounter = 0;

function newDraft() {
  return {
    id: 'd' + (++_draftIdCounter) + '_' + Date.now(),
    expanded: true,
    date: new Date().toISOString().slice(0,10),
    clientId: 0, clientName: '',
    lines: [{code:'', name:'', vatType:'', qty:0, price:0, amt:0}],
    cash:'', bank:'', card:''
  };
}

// ── 모달 상태 ──
let _mType = '', _mPre = '', _mDraftId = '', _mLineIdx = -1, _mData = [];

const $ = id => document.getElementById(id);
const fmt = n => Number(n||0).toLocaleString('ko-KR');
const parseN = v => parseInt(String(v||'').replace(/,/g,'')) || 0;

function headers() { return {'Content-Type':'application/json','X-Mobile-Token':TOKEN}; }
async function api(path, opts={}) {
  const res = await fetch(API + path, {headers:headers(), ...opts});
  return res.json();
}

function toast(msg, dur=2500) {
  const el=$('toast'); el.textContent=msg; el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'), dur);
}
function loading(on) { $('loading').className = on ? 'on' : ''; }

// ── 로그인/로그아웃 ──
async function doLogin() {
  const u=$('l-u').value.trim(), p=$('l-p').value.trim();
  if(!u||!p){$('lerr').textContent='아이디와 비밀번호를 입력하세요.';return;}
  loading(true);
  try {
    const r = await fetch(API+'/api/mobile/login',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user:u,pass:p})
    }).then(r=>r.json());
    if(!r.ok){$('lerr').textContent=r.error||'로그인 실패';return;}
    TOKEN=r.token; USERNAME=u;
    localStorage.setItem('bm_tok',TOKEN);
    localStorage.setItem('bm_usr',USERNAME);
    await initApp();
  } catch(e){ $('lerr').textContent='서버에 연결할 수 없습니다.'; }
  finally { loading(false); }
}
$('l-p').addEventListener('keydown', e=>{if(e.key==='Enter')doLogin();});

function doLogout() {
  localStorage.removeItem('bm_tok'); localStorage.removeItem('bm_usr'); TOKEN='';
  $('app').style.display='none'; $('login').style.display='flex';
  $('l-u').value=''; $('l-p').value=''; $('lerr').textContent='';
}

// ── 앱 초기화 ──
async function initApp() {
  loading(true);
  try {
    const [cr,ir,cor] = await Promise.all([
      api('/api/clients'), api('/api/items'), api('/api/company')
    ]);
    CLIENTS = cr.data || [];
    ITEMS   = ir.data || [];
    if(cor.data?.Co_Name) $('hd-co').textContent = cor.data.Co_Name;
    if(sDrafts.length===0) addDraft('s');
    if(bDrafts.length===0) addDraft('b');
    $('login').style.display='none';
    $('app').style.display='flex';
    renderClients(); renderItems();
  } catch(e){ $('lerr').textContent='데이터 로드 실패: '+e.message; }
  finally { loading(false); }
}

// ── 탭 전환 ──
const TABS = ['sales','purchase','clients','items'];
const TAB_LABELS = {sales:'매출 입력',purchase:'매입 입력',clients:'거래처 조회',items:'품목 조회'};
function switchTab(tab) {
  TABS.forEach(t=>{
    $('p-'+t).classList.toggle('on',t===tab);
    $('nb-'+t).classList.toggle('on',t===tab);
  });
  $('hd-tab').textContent = TAB_LABELS[tab]||tab;
}

// ══════════════════════════════════════════════════════
//  다중 드래프트 관리
// ══════════════════════════════════════════════════════
function addDraft(pre) {
  const d = newDraft();
  if(pre==='s') sDrafts.push(d);
  else bDrafts.push(d);
  renderDrafts(pre);
  setTimeout(()=>{
    const el=document.getElementById('draft-'+d.id);
    if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'});
  }, 80);
}

function removeDraft(pre, id) {
  if(pre==='s') sDrafts=sDrafts.filter(d=>d.id!==id);
  else bDrafts=bDrafts.filter(d=>d.id!==id);
  if((pre==='s'?sDrafts:bDrafts).length===0) addDraft(pre);
  else renderDrafts(pre);
}

function toggleDraft(pre, id) {
  const d=(pre==='s'?sDrafts:bDrafts).find(x=>x.id===id);
  if(d){d.expanded=!d.expanded; renderDrafts(pre);}
}

function renderDrafts(pre) {
  const arr = pre==='s' ? sDrafts : bDrafts;
  const wrap = $(pre==='s'?'s-drafts-wrap':'b-drafts-wrap');
  const gl = pre==='s'?'매출':'매입';
  wrap.innerHTML = arr.map(d=>{
    const total = d.lines.reduce((s,l)=>s+l.amt,0);
    const cnt   = d.lines.filter(l=>l.code).length;
    const cash  = parseN(d.cash), bank=parseN(d.bank), card=parseN(d.card);
    const um    = total - cash - bank - card;
    return `
<div class="draft-card" id="draft-${d.id}">
  <div class="draft-hd" onclick="toggleDraft('${pre}','${d.id}')">
    <div class="draft-hd-info">
      <span class="draft-client${d.clientName?'':' empty'}">${d.clientName||'거래처 미선택'}</span>
      <span class="draft-meta">${cnt}품목 · ${fmt(total)}원</span>
    </div>
    <div class="draft-hd-btns">
      <span class="draft-badge">${gl}</span>
      <button class="draft-del-btn" onclick="event.stopPropagation();removeDraft('${pre}','${d.id}')">×</button>
      <span class="draft-arrow">${d.expanded?'▲':'▼'}</span>
    </div>
  </div>
  ${d.expanded?`
  <div class="draft-body">
    <div style="height:10px"></div>
    <div class="row2" style="margin-bottom:10px">
      <div>
        <div class="fl">날짜</div>
        <input type="date" class="fin" value="${d.date}"
          onchange="draftSet('${pre}','${d.id}','date',this.value)">
      </div>
      <div>
        <div class="fl">거래처</div>
        <button class="fin" style="text-align:left;cursor:pointer;color:${d.clientName?'#212121':'#90a4ae'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis"
          onclick="openModal('client','${pre}','${d.id}',-1)">
          ${d.clientName||'선택 ▼'}
        </button>
      </div>
    </div>

    <div class="card-title" style="margin-bottom:8px">품목 내역</div>
    ${d.lines.map((ln,i)=>`
    <div class="ic">
      <div class="ic-top">
        <span class="ic-name">${ln.name||(ln.code?ln.code:'(품목 선택)')}</span>
        <button class="ic-del" onclick="draftDelLine('${pre}','${d.id}',${i})">×</button>
      </div>
      <div class="ic-grid">
        <div>
          <div class="ic-lbl">품목</div>
          <button class="ic-inp sel-btn" onclick="openModal('item','${pre}','${d.id}',${i})">
            ${ln.code||'선택'}
          </button>
        </div>
        <div>
          <div class="ic-lbl">수량</div>
          <input type="number" class="ic-inp" value="${ln.qty||''}" min="0" step="0.01"
            oninput="draftLineVal('${pre}','${d.id}',${i},'qty',this.value)">
        </div>
        <div>
          <div class="ic-lbl">단가</div>
          <input type="number" class="ic-inp" value="${ln.price||''}" min="0"
            oninput="draftLineVal('${pre}','${d.id}',${i},'price',this.value)">
        </div>
        <div style="grid-column:span 3">
          <div class="ic-lbl">금액</div>
          <div class="ic-amt" id="da-${d.id}-${i}">${fmt(ln.amt)}</div>
        </div>
      </div>
    </div>`).join('')}
    <button class="add-btn" onclick="draftAddLine('${pre}','${d.id}')">+ 품목 추가</button>

    <div class="card-title" style="margin-bottom:8px">결제</div>
    <div class="pay-row"><span class="pay-lbl">현금</span>
      <input type="number" class="pay-inp" value="${d.cash||''}" placeholder="0"
        oninput="draftSet('${pre}','${d.id}','cash',this.value);draftPayCalc('${pre}','${d.id}')"></div>
    <div class="pay-row"><span class="pay-lbl">통장</span>
      <input type="number" class="pay-inp" value="${d.bank||''}" placeholder="0"
        oninput="draftSet('${pre}','${d.id}','bank',this.value);draftPayCalc('${pre}','${d.id}')"></div>
    <div class="pay-row"><span class="pay-lbl">카드</span>
      <input type="number" class="pay-inp" value="${d.card||''}" placeholder="0"
        oninput="draftSet('${pre}','${d.id}','card',this.value);draftPayCalc('${pre}','${d.id}')"></div>
    <div class="pay-row"><span class="pay-lbl">${pre==='s'?'미수':'미지급'}</span>
      <div class="pay-um" id="du-${d.id}">${fmt(um)}</div></div>

    <div class="tot-bar" style="margin-top:10px">
      <div><div class="tot-lbl">${gl}금액</div>
      <div class="tot-amt" id="dt-${d.id}">${fmt(total)}</div></div>
    </div>
    <button class="save-btn" onclick="saveDraft('${pre}','${d.id}')">${gl} 저장</button>
    <div style="height:8px"></div>
  </div>`:``}
</div>`}).join('');
}

// ── 드래프트 필드 업데이트 ──
function draftSet(pre, id, field, val) {
  const d=(pre==='s'?sDrafts:bDrafts).find(x=>x.id===id);
  if(d) d[field]=val;
}

function draftPayCalc(pre, id) {
  const d=(pre==='s'?sDrafts:bDrafts).find(x=>x.id===id);
  if(!d) return;
  const total=d.lines.reduce((s,l)=>s+l.amt,0);
  const um=total-parseN(d.cash)-parseN(d.bank)-parseN(d.card);
  const el=$('du-'+id); if(el) el.textContent=fmt(um);
}

function draftAddLine(pre, id) {
  const d=(pre==='s'?sDrafts:bDrafts).find(x=>x.id===id);
  if(!d) return;
  d.lines.push({code:'',name:'',vatType:'',qty:0,price:0,amt:0});
  renderDrafts(pre);
}

function draftDelLine(pre, id, idx) {
  const d=(pre==='s'?sDrafts:bDrafts).find(x=>x.id===id);
  if(!d) return;
  if(d.lines.length<=1){toast('최소 1개 품목이 필요합니다');return;}
  d.lines.splice(idx,1);
  renderDrafts(pre);
}

function draftLineVal(pre, id, idx, field, val) {
  const d=(pre==='s'?sDrafts:bDrafts).find(x=>x.id===id);
  if(!d||!d.lines[idx]) return;
  if(field==='qty')   d.lines[idx].qty  = parseFloat(val)||0;
  if(field==='price') d.lines[idx].price= parseN(val);
  d.lines[idx].amt = Math.round(d.lines[idx].qty * d.lines[idx].price);
  // 금액셀만 업데이트 (전체 리렌더 없이)
  const amtEl=$('da-'+id+'-'+idx); if(amtEl) amtEl.textContent=fmt(d.lines[idx].amt);
  const total=d.lines.reduce((s,l)=>s+l.amt,0);
  const totEl=$('dt-'+id); if(totEl) totEl.textContent=fmt(total);
  draftPayCalc(pre,id);
  // 헤더 메타도 업데이트
  const metaEl=document.querySelector(`#draft-${id} .draft-meta`);
  if(metaEl) metaEl.textContent=`${d.lines.filter(l=>l.code).length}품목 · ${fmt(total)}원`;
}

// ── 저장 ──
async function saveDraft(pre, id) {
  const arr=pre==='s'?sDrafts:bDrafts;
  const d=arr.find(x=>x.id===id);
  if(!d) return;
  const isSales=pre==='s';
  const gubun=isSales?'1':'2';
  const validLines=d.lines.filter(l=>l.code&&l.qty&&l.amt);
  if(!d.date){toast('날짜를 입력하세요');return;}
  if(!d.clientId){toast('거래처를 선택하세요');return;}
  if(validLines.length===0){toast('품목을 추가하세요');return;}
  loading(true);
  try {
    const ticketR=await api('/api/inven/nextticket');
    const ticket=ticketR.next_ticket||1;
    const totalAmt=validLines.reduce((s,l)=>s+l.amt,0);
    const totalQty=validLines.reduce((s,l)=>s+l.qty,0);
    const cash=parseN(d.cash), bank=parseN(d.bank), card=parseN(d.card);
    const mast={
      Ivn_Date:d.date, Ivn_Ticket:ticket, Ivn_Gubun:gubun,
      Ivn_soGubun:0, Ivn_Qty:totalQty, Ivn_Total:totalAmt,
      Ivn_Amt:totalAmt, Ivn_Tax:0, Ivn_Qty1:0, Ivn_Total1:0,
      Ivn_Amt1:0, Ivn_Tax1:0, Ivn_C:0, Ivn_DC:0,
      Ivn_Time:'', Ivn_Sawon:1, Ivn_Client:parseInt(d.clientId)||0, Ivn_Conr:0,
      Ivn_Cash:cash, Ivn_Card:card, Ivn_Bank:bank, Ivn_Um:null,
      Ivn_No1:null, Ivn_No2:null, Ivn_Blank:0,
      Ivn_sGubun1:0, Ivn_sGubun2:0, Ivn_sGubun3:0,
      Ivn_VAT:'2', Ivn_TicketNo:null, Ivn_Bigo:null
    };
    let seq=1;
    const tran=validLines.map(l=>({
      Inot_Date:d.date, Inot_Ticket:ticket, Inot_Gubun:gubun,
      Inot_Item:String(l.code), Inot_Quty:l.qty, Inot_Unit:l.price,
      Inot_Amt:l.amt, Inot_No:seq++, Inot_Time:'',
      Inot_Client:parseInt(d.clientId)||0, Inot_Conr:0, Inot_sDate:d.date,
      Inot_Sawon:1, Inot_sSawon:0, Inot_TicketNo:null, Inot_Bigo:null,
      Inot_IvnGubun:gubun, Inot_Size:0, Inot_dSawon:0,
      Inot_Size1:null, Inot_Gong:0, Inot_Tax:0, Inot_C:0
    }));
    const r=await api('/api/inven',{method:'POST',body:JSON.stringify({mast,tran})});
    if(!r.ok){toast('저장 실패: '+(r.error||''));return;}
    toast(`${isSales?'매출':'매입'} 저장 완료 (전표 ${ticket}) ✓`);
    if(pre==='s') sDrafts=sDrafts.filter(x=>x.id!==id);
    else bDrafts=bDrafts.filter(x=>x.id!==id);
    if((pre==='s'?sDrafts:bDrafts).length===0) addDraft(pre);
    else renderDrafts(pre);
  } catch(e){ toast('오류: '+e.message); }
  finally { loading(false); }
}

// ── 거래처/품목 조회 렌더 ──
function renderClients() {
  const q=($('cl-q')?.value||'').trim().toLowerCase();
  const list=q?CLIENTS.filter(c=>(c.Client_Name||'').toLowerCase().includes(q)||String(c.Client_ID||'').includes(q)):CLIENTS;
  $('cl-list').innerHTML=list.length===0?'<div class="empty">검색 결과 없음</div>'
    :list.slice(0,80).map(c=>`
    <div class="list-card">
      <div class="lc-left">
        <div class="lc-name">${c.Client_Name||''}</div>
        <div class="lc-sub">${c.Client_Tel||''}</div>
      </div>
      <div class="lc-right">
        <div class="lc-code">코드 ${c.Client_ID}</div>
        <div class="lc-code">${c.Client_Gubun==='1'?'매입처':c.Client_Gubun==='2'?'매출처':'거래처'}</div>
      </div>
    </div>`).join('');
}

function renderItems() {
  const q=($('it-q')?.value||'').trim().toLowerCase();
  const list=q?ITEMS.filter(i=>(i.Item_Name||'').toLowerCase().includes(q)||String(i.Item_Code||'').includes(q)):ITEMS;
  $('it-list').innerHTML=list.length===0?'<div class="empty">검색 결과 없음</div>'
    :list.slice(0,100).map(i=>`
    <div class="list-card">
      <div class="lc-left">
        <div class="lc-name">${i.Item_Name||''}</div>
        <div class="lc-sub">${i.Item_Size1||i.Item_Size||''} ${i._vatType||''}</div>
      </div>
      <div class="lc-right">
        <div class="lc-price">${fmt(i.Item_Amt1||i.Item_Amt||0)}원</div>
        <div class="lc-code">${i.Item_Code}</div>
      </div>
    </div>`).join('');
}

// ── 모달 ──
function openModal(type, pre, draftId, lineIdx) {
  _mType=type; _mPre=pre; _mDraftId=draftId; _mLineIdx=lineIdx;
  const isItem=type==='item';
  $('m-title').textContent=isItem?'품목 검색':'거래처 검색';
  $('m-q').value='';
  $('modal').classList.add('on');
  filterModal();
  setTimeout(()=>$('m-q').focus(),300);
}
function closeModal(){ $('modal').classList.remove('on'); }

function filterModal() {
  const q=($('m-q').value||'').trim().toLowerCase();
  const isItem=_mType==='item';
  let filtered=q
    ?(isItem?ITEMS:CLIENTS).filter(x=>{
        const name=isItem?(x.Item_Name||''):(x.Client_Name||'');
        const code=isItem?String(x.Item_Code||''):String(x.Client_ID||'');
        return name.toLowerCase().includes(q)||code.includes(q);
      })
    :(isItem?ITEMS:CLIENTS);
  if(!isItem&&_mPre){
    const g=_mPre==='s'?'2':(_mPre==='b'?'1':'');
    if(g) filtered=filtered.filter(c=>c.Client_Gubun===g||!c.Client_Gubun);
  }
  filtered=filtered.slice(0,60);
  $('m-list').innerHTML=filtered.length===0
    ?'<div class="empty" style="padding:30px 0">검색 결과 없음</div>'
    :filtered.map((x,i)=>isItem?`
    <div class="mi" onclick="selectModal(${i})">
      <div><div class="mi-name">${x.Item_Name||''}</div>
      <div class="mi-sub">${x.Item_Code} ${x.Item_Size1||x.Item_Size||''}</div></div>
      <div class="mi-price">${fmt(x.Item_Amt1||x.Item_Amt||0)}원</div>
    </div>`:
    `<div class="mi" onclick="selectModal(${i})">
      <div><div class="mi-name">${x.Client_Name||''}</div>
      <div class="mi-sub">${x.Client_Tel||''}</div></div>
      <div class="mi-price" style="color:#546e7a;font-size:12px">${x.Client_ID}</div>
    </div>`).join('');
  _mData=filtered;
}

function selectModal(idx) {
  const item=_mData[idx]; if(!item) return;
  closeModal();
  const arr=_mPre==='s'?sDrafts:bDrafts;
  const d=arr.find(x=>x.id===_mDraftId); if(!d) return;
  if(_mType==='client') {
    d.clientId=item.Client_ID;
    d.clientName=item.Client_Name||'';
    renderDrafts(_mPre);
    return;
  }
  // 품목 선택
  if(_mLineIdx>=0&&_mLineIdx<d.lines.length) {
    const price=parseFloat(item.Item_Amt1||item.Item_Amt||0);
    d.lines[_mLineIdx]={
      code:String(item.Item_Code), name:item.Item_Name||'',
      vatType:item._vatType||'', qty:0, price:price, amt:0
    };
    renderDrafts(_mPre);
  }
}

  if(TOKEN){
    try {
      const r=await api('/api/health');
      if(r.ok){await initApp();return;}
    } catch(e){}
    TOKEN=''; localStorage.removeItem('bm_tok');
  }
  $('login').style.display='flex';
})();
</script>
